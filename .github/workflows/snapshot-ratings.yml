name: Build Letterboxd snapshot

on:
  push:
    branches: ["main"]
    paths:
      - "data.js"
      - "catalog-extra.js"
      - "scripts/update-ratings.js"
      - ".github/workflows/snapshot-ratings.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "letterboxd-snapshot-v2"
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Build snapshot
        run: node scripts/update-ratings.js
      - name: Commit snapshot
        run: |
          if git diff --quiet -- ratings-snapshot.js; then
            echo "No snapshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ratings-snapshot.js
          git commit -m "Update Letterboxd rating snapshot"
          git pull --rebase origin main
          git push
