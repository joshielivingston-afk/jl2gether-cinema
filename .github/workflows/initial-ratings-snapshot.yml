name: Initial fast Letterboxd snapshot

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/initial-ratings-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Build full snapshot
        run: node scripts/update-ratings.js --refresh-all
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ratings-snapshot.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Letterboxd rating snapshot"
          git pull --rebase origin main
          git push
