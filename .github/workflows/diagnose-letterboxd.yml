name: Diagnose Letterboxd fetch

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/diagnose-letterboxd.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Fetch via reader proxy
        run: |
          node - <<'NODE'
          const urls=[
            'https://r.jina.ai/http://letterboxd.com/csi/film/parasite-2019/rating-histogram/',
            'https://r.jina.ai/https://letterboxd.com/csi/film/parasite-2019/rating-histogram/'
          ];
          for(const url of urls){
            const r=await fetch(url,{headers:{'Accept':'text/plain'}});
            const text=await r.text();
            console.log('URL',url);
            console.log('STATUS',r.status);
            console.log('TYPE',r.headers.get('content-type'));
            console.log('LENGTH',text.length);
            console.log(text.slice(0,3500));
            console.log('---END---');
          }
          NODE
