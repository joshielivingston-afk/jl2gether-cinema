name: Diagnose Letterboxd fetch

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/diagnose-letterboxd.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Test four stubborn rating fragments
        run: |
          node - <<'NODE'
          const slugs=['baby-driver','8-half','cemetery-man','miracle-mile'];
          for(const slug of slugs){
            const url='https://r.jina.ai/https://letterboxd.com/csi/film/'+slug+'/rating-histogram/';
            const r=await fetch(url,{headers:{'Accept':'text/plain'}});
            const text=await r.text();
            console.log('\nSLUG',slug,'STATUS',r.status,'LEN',text.length);
            console.log(text.slice(0,1800));
            await new Promise(x=>setTimeout(x,3300));
          }
          NODE
