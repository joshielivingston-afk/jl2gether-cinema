name: Diagnose Letterboxd fetch

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/diagnose-letterboxd.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Test Letterboxd search resolution
        run: |
          node - <<'NODE'
          const url='https://r.jina.ai/https://letterboxd.com/search/run%20lola%20run/';
          const r=await fetch(url,{headers:{'Accept':'text/plain'}});
          const text=await r.text();
          console.log('STATUS',r.status,'LENGTH',text.length);
          console.log(text.slice(0,8000));
          NODE
